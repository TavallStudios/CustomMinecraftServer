version: 2

source:
  repository: TavallStudios/CustomMinecraftServer
  provider: github

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

dependencies:
  - kind: source
    identity: TavallStudios/tavall-hytale-resource-game
    role: SHARED_DEP
    selector: required-source
    substitutions: "com.tavall:game-api=:game-api"
  - kind: source
    identity: TavallStudios/tavall-cache
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-concurrency
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-di
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-eventbus
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-logging
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-reflection
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-scheduler
    role: SHARED_DEP
    selector: required-source

artifacts:
  - name: custom-minecraft-server
    path: build/libs/custom-minecraft-server.jar

requiredChecks:
  - quality

checks:
  quality:
    executor: gradle
    tasks:
      - "clean"
      - "check"
      - "assemble"

name: Java CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Check out resource-game API migration
        uses: actions/checkout@v4
        with:
          repository: tjXJNOOBIE/tavall-hytale-resource-game
          ref: working/migrate-to-gradle
          path: .dependency-source/tavall-hytale-resource-game
          fetch-depth: 0
      - name: Publish resource-game API for the build
        working-directory: .dependency-source/tavall-hytale-resource-game
        run: ./gradlew --no-daemon :game-api:publishToMavenLocal
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build and test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon clean check stageDistribution
